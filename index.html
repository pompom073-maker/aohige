<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>青髭探偵怪奇ファイル</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background:
        radial-gradient(circle at center, #20242c 0%, #090b0f 100%);
    color: #fff;
    font-family:
        "Yu Gothic",
        "Hiragino Kaku Gothic ProN",
        Meiryo,
        sans-serif;
}

#game {
    width: min(900px, 100vw);
    height: min(650px, 100vh);
    margin: auto;
    position: relative;
    background: #111;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(0,0,0,.6);
}

button {
    font-family: inherit;
    cursor: pointer;
}

.hidden {
    display: none !important;
}


/* =========================================================
    タイトル画面（背景画像適用）
========================================================= */

#titleScreen {
    position: absolute;
    inset: 0;
    z-index: 100;
    background: 
        linear-gradient(rgba(5, 3, 8, 0.65), rgba(5, 3, 8, 0.75)),
        url('https://lh3.googleusercontent.com/d/1MTDgj-oVtnRZDwaAsoAnQfRN62MIf7yw') center/cover no-repeat;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.main-title {
    font-size: clamp(28px, 6vw, 48px);
    font-weight: 900;
    letter-spacing: .15em;
    color: #ff3b5c;
    text-shadow: 
        0 0 10px rgba(255, 59, 92, 0.8),
        0 0 25px rgba(255, 59, 92, 0.5),
        3px 3px 0px #000;
    margin-bottom: 5px;
    text-align: center;
}

.sub-title {
    font-size: clamp(14px, 2.5vw, 18px);
    color: #9fd6ff;
    letter-spacing: .2em;
    margin-bottom: 40px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.9), 0 0 8px rgba(159,214,255,0.6);
}

.title-menu {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: min(280px, 80%);
}

.menuBtn {
    padding: 14px;
    font-size: 18px;
    font-weight: bold;
    letter-spacing: .1em;
    border-radius: 30px;
    border: 2px solid #ff3b5c;
    background: rgba(15, 10, 20, 0.75);
    color: #fff;
    backdrop-filter: blur(4px);
    transition: all 0.2s ease;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
}

.menuBtn:hover:not(:disabled) {
    background: rgba(255, 59, 92, 0.5);
    border-color: #fff;
    transform: scale(1.03);
    box-shadow: 0 0 25px rgba(255, 59, 92, 0.6);
}

.menuBtn:disabled {
    opacity: 0.35;
    border-color: #666;
    background: rgba(0, 0, 0, 0.4);
    color: #888;
    cursor: not-allowed;
    box-shadow: none;
}


/* =========================================================
    ノベル画面
========================================================= */

#novelScreen {
    position: absolute;
    inset: 0;
    background: #111;
}

#novelCharacter {
    position: absolute;
    inset: 0;
}

#novelCharacter img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

#novelBox {
    position: absolute;
    left: 25px;
    right: 25px;
    bottom: 18px;
    min-height: 135px;
    padding: 18px 22px;
    background: rgba(5,7,11,.93);
    border: 2px solid rgba(255,255,255,.25);
    border-radius: 12px;
    box-shadow: 0 8px 25px rgba(0,0,0,.5);
    z-index: 10;
}

#speaker {
    font-size: 20px;
    font-weight: bold;
    color: #9fd6ff;
    margin-bottom: 8px;
}

#dialogue {
    font-size: 18px;
    line-height: 1.8;
    min-height: 65px;
    padding-right: 75px;
    white-space: pre-wrap;
}

#nextButton {
    position: absolute;
    right: 18px;
    bottom: 12px;
    padding: 7px 18px;
    border: 1px solid #aaa;
    border-radius: 20px;
    background: rgba(255,255,255,.1);
    color: white;
}

#nextButton:hover {
    background: rgba(255,255,255,.22);
}


/* =========================================================
    推理モード
========================================================= */

#puzzleScreen {
    position: absolute;
    inset: 0;
    background: #0d0e11;
}

#puzzleCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
}

#puzzleUI {
    position: absolute;
    left: 15px;
    right: 15px;
    top: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
}

#caseTitle {
    font-weight: bold;
    font-size: 18px;
    text-shadow: 0 2px 5px #000;
}

#hairCount {
    padding: 6px 12px;
    border-radius: 20px;
    background: rgba(0,0,0,.65);
    font-size: 15px;
}

#instruction {
    position: absolute;
    left: 50%;
    top: 52px;
    transform: translateX(-50%);
    padding: 8px 15px;
    background: rgba(0,0,0,.65);
    border-radius: 20px;
    font-size: 14px;
    white-space: nowrap;
    pointer-events: none;
    opacity: .9;
}


/* =========================================================
    証言ポップアップ
========================================================= */

#testimonyPopup {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(.9);
    width: min(600px, 85%);
    padding: 25px;
    background: linear-gradient(145deg, rgba(25,28,35,.98), rgba(8,10,14,.98));
    border: 2px solid #d7d7d7;
    border-radius: 15px;
    box-shadow: 0 15px 50px rgba(0,0,0,.8), inset 0 0 20px rgba(255,255,255,.04);
    z-index: 20;
    opacity: 0;
    pointer-events: none;
    transition: .25s;
}

#testimonyPopup.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
    pointer-events: auto;
}

#testimonyTitle {
    font-size: 14px;
    color: #aaa;
    margin-bottom: 8px;
}

#testimonyText {
    font-size: 20px;
    line-height: 1.7;
}

#testimonyClose {
    display: block;
    margin: 18px auto 0;
    padding: 8px 25px;
    border: none;
    border-radius: 20px;
    background: #fff;
    color: #111;
}


/* =========================================================
    毛根キーワード選択演出画面
========================================================= */

#revelationScreen {
    position: absolute;
    inset: 0;
    z-index: 40;
    background: #030406;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
    overflow: hidden;
}

#revelationScreen.show {
    opacity: 1;
    pointer-events: auto;
}

.rev-silence {
    position: absolute;
    font-size: 22px;
    color: #666;
    letter-spacing: .3em;
    opacity: 0;
    transition: 0.5s;
}
.rev-silence.show {
    opacity: 1;
}

.hair-icon-lg {
    width: 84px;
    height: 84px;
    object-fit: cover;
    border-radius: 50%;
    vertical-align: middle;
    margin-right: 8px;
    border: 2px solid rgba(255,255,255,0.6);
}

.whisper-hair {
    position: absolute;
    font-size: 16px;
    color: #9fd6ff;
    background: rgba(15,20,30,0.85);
    padding: 8px 16px;
    border: 1px solid rgba(159,214,255,0.3);
    border-radius: 25px;
    opacity: 0;
    transform: scale(0.8);
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    white-space: nowrap;
    z-index: 2;
}

.whisper-hair.show {
    opacity: 1;
    transform: scale(1);
}

#kwSelectContainer {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    width: min(550px, 90%);
    background: rgba(15,20,30,0.95);
    border: 2px solid #ffde59;
    border-radius: 15px;
    padding: 25px;
    text-align: center;
    box-shadow: 0 0 30px rgba(255,222,89,0.3);
    z-index: 10;
    opacity: 0;
    pointer-events: none;
    transition: all 0.4s ease;
}

#kwSelectContainer.show {
    opacity: 1;
    pointer-events: auto;
    transform: translate(-50%, -50%) scale(1);
}

.kw-title {
    font-size: 18px;
    color: #ffde59;
    font-weight: bold;
    margin-bottom: 15px;
}

.kw-choices {
    display: grid;
    gap: 10px;
}

.kwBtn {
    padding: 12px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 8px;
    color: #fff;
    font-size: 16px;
    transition: 0.2s;
}

.kwBtn:hover {
    background: rgba(255,222,89,0.25);
    border-color: #ffde59;
}

.linked-hairs-group {
    position: absolute;
    top: 35%;
    text-align: center;
    opacity: 0;
    transform: scale(0.7);
    transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 3;
}

.linked-hairs-group.show {
    opacity: 1;
    transform: scale(1);
}

.linked-icons-big {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 15px;
}

.hair-icon-xl {
    width: 120px;
    height: 120px;
    object-fit: cover;
    border-radius: 50%;
    margin: 0 8px;
    border: 4px solid #ffde59;
    box-shadow: 0 0 30px rgba(255,222,89,0.6);
}

.linked-speech {
    font-size: 30px;
    font-weight: bold;
    color: #ffde59;
    text-shadow: 0 0 25px rgba(255,222,89,0.5);
    letter-spacing: .1em;
}

.rev-thought {
    position: absolute;
    font-size: 22px;
    color: #fff;
    letter-spacing: .1em;
    text-align: center;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.4s ease;
    z-index: 4;
}

.rev-thought.show {
    opacity: 1;
    transform: translateY(0);
}

.rev-click-hint {
    position: absolute;
    bottom: 25px;
    font-size: 13px;
    color: #aaa;
    letter-spacing: .1em;
    animation: blink 1.5s infinite;
    z-index: 5;
}

@keyframes blink {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
}

#revNextBtn {
    position: absolute;
    bottom: 40px;
    padding: 12px 32px;
    border-radius: 25px;
    background: rgba(255,222,89,0.2);
    border: 1px solid #ffde59;
    color: #ffde59;
    font-size: 16px;
    font-weight: bold;
    opacity: 0;
    pointer-events: none;
    transition: 0.4s ease;
    z-index: 5;
}

#revNextBtn.show {
    opacity: 1;
    pointer-events: auto;
}

#revNextBtn:hover {
    background: rgba(255,222,89,0.4);
}


/* =========================================================
    第一話 完
========================================================= */

#episodeComplete {
    position: absolute;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.94);
    opacity: 0;
    pointer-events: none;
    transition: .5s;
}

#episodeComplete.show {
    opacity: 1;
    pointer-events: auto;
}

#episodeCompleteText {
    text-align: center;
    font-size: 45px;
    letter-spacing: .12em;
    text-shadow: 0 0 25px rgba(255,255,255,.35);
}

#episodeCompleteSub {
    margin-top: 15px;
    font-size: 15px;
    color: #aaa;
    letter-spacing: .2em;
}

.backToTitleBtn {
    margin-top: 30px;
    padding: 10px 25px;
    border-radius: 20px;
    border: 1px solid #aaa;
    background: rgba(255,255,255,0.1);
    color: #fff;
    font-size: 14px;
}
.backToTitleBtn:hover {
    background: rgba(255,255,255,0.25);
}


/* =========================================================
    スマホレスポンシブ対応
========================================================= */

@media (max-width: 600px) {
    #dialogue {
        font-size: 15px;
    }
    #testimonyText {
        font-size: 17px;
    }
    #episodeCompleteText {
        font-size: 32px;
    }
    .whisper-hair {
        font-size: 13px;
        padding: 6px 12px;
    }
    .linked-speech {
        font-size: 24px;
    }
    .rev-thought {
        font-size: 18px;
    }
    .hair-icon-xl {
        width: 80px;
        height: 80px;
        margin: 0 4px;
    }
}
</style>
</head>


<body>

<div id="game">

<!-- =====================================================
     タイトル画面
================================================     -->

<div id="titleScreen">
    <div class="main-title">青髭探偵怪奇ファイル</div>
    <div class="sub-title">第一話：シンデレラ失踪事件</div>

    <div class="title-menu">
        <button id="startBtn" class="menuBtn">最初から</button>
        <button id="continueBtn" class="menuBtn" disabled>つづきから</button>
    </div>
</div>


<!-- =====================================================

================================================     -->

<div id="novelScreen" class="hidden">

        <div id="dialogue"></div>

    </div>
</div>


<!-- =====================================================
     毛抜き推理モード
================================================     -->

<div id="puzzleScreen" class="hidden">
    <canvas id="puzzleCanvas"></canvas>

        <div id="caseTitle">青髭探偵・全集中毛抜き推理モード</div>

<!-- =====================================================

    <div class="whisper-hair" id="whisper3" style="top: 72%; left: 10%;"><img src="https://lh3.googleusercontent.com/d/1NVGLGtC0j3UpmLlMXt0YNNmZEIdit1oq" class="hair-icon-lg">「ローン」</div>
    <div class="whisper-hair" id="whisper4" style="top: 78%; right: 10%;"><img src="https://lh3.googleusercontent.com/d/15slNRT0MdumLyjMMHQcLySNNkD-8tHYb" class="hair-icon-lg">「消費者金融」</div>
    <div class="whisper-hair" id="whisper5" style="top: 85%; left: 35%; color: #888; border-color: rgba(255,255,255,0.15);"><img src="https://lh3.googleusercontent.com/d/1tGp1V0XyRiEEMUWZgSSEvSuZRXVGQwvm" class="hair-icon-lg">「早くツルツルにしてくれ」</div>

    <div id="kwSelectContainer">
        <div class="kw-title">🔍 毛根たちの証言が指し示す共通キーワードは？</div>

<!-- =====================================================
     第一話 完
================================================     -->

<div id="episodeComplete">
    <div style="text-align: center;">
        <div id="episodeCompleteText">第一話 完</div>
        <div id="episodeCompleteSub">青髭探偵怪奇ファイル</div>
        <button id="backToTitleBtn" class="backToTitleBtn">タイトルへ戻る</button>
    </div>
</div>

</div>


<script>
/* =========================================================
    🎵 オーディオシステム（各シーン別MP3音声対応 & BGM音量調整）
========================================================= */

let audioCtx = null;

// BGM用のAudioオブジェクト群（volumeで音量を調整できます 例: 0.2 は 20%の音量）
const titleAudio = new Audio("./bgm_title.mp3");
titleAudio.loop = true;
titleAudio.preload = "auto";
titleAudio.volume = 0.2; 

const scene2Audio = new Audio("./bgm_scene2.mp3");
scene2Audio.loop = true;
scene2Audio.preload = "auto";
scene2Audio.volume = 0.2;

const moukonAudio = new Audio("./moukon.mp3");
moukonAudio.loop = true;
moukonAudio.preload = "auto";
moukonAudio.volume = 0.2;

const sinsouAudio = new Audio("./sinsou.mp3");
sinsouAudio.loop = true;
sinsouAudio.preload = "auto";
sinsouAudio.volume = 0.2;

const kaiketuAudio = new Audio("./kaiketu.mp3");
kaiketuAudio.loop = true;
kaiketuAudio.preload = "auto";
kaiketuAudio.volume = 0.2;

const allBgms = [titleAudio, scene2Audio, moukonAudio, sinsouAudio, kaiketuAudio];

// SE用のAudioオブジェクト群
const startSe = new Audio("./start.mp3");
startSe.preload = "auto";

const hanasuSe = new Audio("./hanasu.mp3");
hanasuSe.preload = "auto";

const batuSe = new Audio("./batu.mp3");
batuSe.preload = "auto";

const noxtukuSe = new Audio("./noxtuku.mp3");
noxtukuSe.preload = "auto";

const doaSe = new Audio("./doa.mp3");
doaSe.preload = "auto";

const hiramekiSe = new Audio("./hirameki.mp3");
hiramekiSe.preload = "auto";

// ご指定の各証言ごとの専用SEオブジェクト群
const hunSe = new Audio("./hun.mp3");
hunSe.preload = "auto";

const eiSe = new Audio("./ei.mp3");
eiSe.preload = "auto";

const kyaSe = new Audio("./kya.mp3");
kyaSe.preload = "auto";

const iyaSe = new Audio("./iya.mp3");
iyaSe.preload = "auto";

const darekaSe = new Audio("./dareka.mp3");
darekaSe.preload = "auto";

function stopAllBGM() {
    allBgms.forEach(audio => {
        audio.pause();
        audio.currentTime = 0;
    });
}

function playBGM(targetAudio) {
    stopAllBGM();
    targetAudio.play().catch(e => {
        console.log("BGMの自動再生がブロックされました:", e.name);
    });
}

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === "suspended") {
        audioCtx.resume();
    }
}

function playTone(frequency, duration, volume = 0.04, type = "square") {
    if (!audioCtx || !frequency) return;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = type;
    osc.frequency.value = frequency;

    const now = audioCtx.currentTime;

    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(volume, now + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(now);
    osc.stop(now + duration + 0.03);
}

const FAMICOM_NOTES = {
    C3: 130.81, D3: 146.83, E3: 164.81, F3: 174.61, G3: 196.00, A3: 220.00, B3: 246.94,
    C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.00, A4: 440.00, B4: 493.88,
    C5: 523.25, D5: 587.33, E5: 659.25, G5: 783.99
};

function seGrab() { initAudio(); playTone(FAMICOM_NOTES.C5, 0.05, 0.045, "square"); }

function seWrong() {
    batuSe.currentTime = 0;
    batuSe.play().catch(e => console.log("batu.mp3再生エラー:", e));
}


/* =========================================================
    セーブ＆コンティニューシステム
========================================================= */

const SAVE_KEY = "aohige_mystery_save";

function saveProgress(stage) {
    try {
        localStorage.setItem(SAVE_KEY, JSON.stringify({ stage: stage }));
        checkSaveData();
    } catch(e) {
        console.error("Save failed", e);
    }
}

function loadProgress() {
    try {
        const dataStr = localStorage.getItem(SAVE_KEY);
        if (!dataStr) return null;
        return JSON.parse(dataStr);
    } catch(e) {
        return null;
    }
}

function checkSaveData() {
    const saveData = loadProgress();
    const continueBtn = document.getElementById("continueBtn");
    if (saveData && saveData.stage) {
        continueBtn.disabled = false;
    } else {
        continueBtn.disabled = true;
    }
}

function startTyping(text) {
    if (typingTimer) {
        clearInterval(typingTimer);
    }
    currentFullText = text;
    dialogue.textContent = "";
    isTyping = true;
    
    hanasuSe.loop = true;
    hanasuSe.currentTime = 0;
    hanasuSe.play().catch(e => console.log("hanasu.mp3再生エラー:", e));

    let charIndex = 0;
    const speed = 70;

    typingTimer = setInterval(() => {
        if (charIndex < currentFullText.length) {
            dialogue.textContent += currentFullText.charAt(charIndex);
            charIndex++;
        } else {
            clearInterval(typingTimer);
            typingTimer = null;
            isTyping = false;
            
            hanasuSe.pause();
            hanasuSe.currentTime = 0;
        }
    }, speed);
}

    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

class Hair {
    constructor(x, y, angle, testimonyIndex) {
        this.rootX = x; this.rootY = y; this.angle = angle; this.testimonyIndex = testimonyIndex;
        this.maxLen = 80 + Math.random() * 40; this.baseLen = 42 + Math.random() * 20;
        this.currentLen = this.baseLen; this.width = 4 + Math.random() * 2;
        this.curlSeed = Math.random() * 100; this.curlAmount = 7 + Math.random() * 8;
        this.removed = false; this.pulling = false; this.progress = 0; this.fly = null; this.redness = 0;
    }
    getRoot() { return { x: this.rootX, y: this.rootY }; }
    getTip() { return { x: this.rootX + Math.cos(this.angle) * this.currentLen, y: this.rootY + Math.sin(this.angle) * this.currentLen }; }
    getDeformedRoot() {
        if (!this.pulling) return { x: this.rootX, y: this.rootY };
        const amount = Math.min(this.progress, 1) * 11;
        return { x: this.rootX + Math.cos(this.angle) * amount, y: this.rootY + Math.sin(this.angle) * amount };
    }
    getPoint(t) {
        const root = this.getDeformedRoot();
        const len = this.currentLen;
        const x = root.x + Math.cos(this.angle) * len * t;
        const y = root.y + Math.sin(this.angle) * len * t;
        const normalX = -Math.sin(this.angle); const normalY = Math.cos(this.angle);
        const wave = Math.sin(t * 9 + this.curlSeed) * this.curlAmount * t * t;
        return { x: x + normalX * wave, y: y + normalY * wave };
    }
    drawHair() {
        const steps = 30;
        ctx.save(); ctx.lineCap = "round"; ctx.lineJoin = "round";
        ctx.beginPath();
        for (let i = 0; i <= steps; i++) {
            const p = this.getPoint(i / steps);
            if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
        }
        ctx.strokeStyle = "rgba(15,12,10,.95)"; ctx.lineWidth = this.width + 2; ctx.stroke();

        ctx.beginPath();
        for (let i = 0; i <= steps; i++) {
            const p = this.getPoint(i / steps);
            if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
        }
        const gradient = ctx.createLinearGradient(this.rootX, this.rootY, this.getTip().x, this.getTip().y);
        gradient.addColorStop(0, "#080706"); gradient.addColorStop(.45, "#27221d"); gradient.addColorStop(1, "#090909");
        ctx.strokeStyle = gradient; ctx.lineWidth = this.width; ctx.stroke();
        ctx.restore();
    }
    drawRoot() {
        const root = this.getDeformedRoot();
        ctx.save();
        ctx.beginPath(); ctx.arc(root.x, root.y, 7 + this.progress * 2, 0, Math.PI * 2);
        ctx.fillStyle = this.pulling ? "rgba(130,65,55,.45)" : "rgba(40,28,25,.45)"; ctx.fill();
        ctx.beginPath(); ctx.arc(root.x, root.y, 3, 0, Math.PI * 2); ctx.fillStyle = "#080706"; ctx.fill();
        ctx.restore();
    }
    drawSkinDeformation() {
        if (!this.pulling) return;
        const root = this.getDeformedRoot(); const amount = Math.min(this.progress, 1);
        ctx.save();
        ctx.beginPath(); ctx.moveTo(root.x, root.y);
        ctx.quadraticCurveTo(root.x + Math.cos(this.angle) * 15 * amount, root.y + Math.sin(this.angle) * 15 * amount, root.x + Math.cos(this.angle) * 26 * amount, root.y + Math.sin(this.angle) * 26 * amount);
        ctx.strokeStyle = `rgba(180,80,70,${.15 + amount * .35})`; ctx.lineWidth = 4 + amount * 3; ctx.stroke();
        ctx.restore();
    }
    drawRedness() {
        if (this.redness <= 0) return;
        ctx.save();
        ctx.beginPath(); ctx.arc(this.rootX, this.rootY, 14 + (1 - this.redness) * 8, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(190,75,65,${this.redness * .22})`; ctx.fill();
        ctx.restore();
    }
    draw() {
        if (this.removed) return;
        this.drawRedness(); this.drawSkinDeformation(); this.drawRoot(); this.drawHair();
    }
    drawFlying() {
        if (!this.fly) return;
        const f = this.fly;
        ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.rotation); ctx.globalAlpha = f.alpha;
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(f.length * .35, f.curve, f.length, 0);
        ctx.strokeStyle = "#17130f"; ctx.lineWidth = this.width; ctx.lineCap = "round"; ctx.stroke();
        ctx.beginPath(); ctx.arc(0, 0, 3, 0, Math.PI * 2); ctx.fillStyle = "#111"; ctx.fill();
        ctx.restore();
    }
    startFlying() {
        this.removed = true; this.pulling = false;
        this.fly = {
            x: this.rootX, y: this.rootY, vx: Math.cos(this.angle) * 4, vy: Math.sin(this.angle) * 4 - 2,
            gravity: .18, rotation: this.angle, rotationSpeed: (Math.random() - .5) * .15,
            length: this.currentLen, curve: (Math.random() - .5) * 20, alpha: 1
        };
        this.redness = 1;
    }
    update() {
        if (this.redness > 0) { this.redness -= .018; if (this.redness < 0) this.redness = 0; }
        if (!this.fly) return;
        this.fly.x += this.fly.vx; this.fly.y += this.fly.vy; this.fly.vy += this.fly.gravity;
        this.fly.rotation += this.fly.rotationSpeed; this.fly.alpha -= .012; if (this.fly.alpha < 0) this.fly.alpha = 0;
    }
}

let hairs = [];
let pulledCount = 0;
let draggingHair = null;
let pointerX = 0;
let pointerY = 0;
let puzzleFinished = false;
let collectedTestimonies = [];

function startPuzzleMode() {
    saveProgress("puzzle");
    playBGM(moukonAudio);
    novelScreen.classList.add("hidden");
    puzzleScreen.classList.remove("hidden");
    resizeCanvas();

    hairs = []; pulledCount = 0; collectedTestimonies = []; puzzleFinished = false;
    const cx = canvas.clientWidth / 2; const cy = canvas.clientHeight / 2 + 70;
    const positions = [
        { x: cx - 100, y: cy - 55, angle: -2.45 },
        { x: cx - 50, y: cy - 75, angle: -2.05 },
        { x: cx, y: cy - 82, angle: -1.75 },
        { x: cx + 55, y: cy - 65, angle: -1.25 },
        { x: cx + 100, y: cy - 40, angle: -.85 }
    ];
    positions.forEach((p, index) => hairs.push(new Hair(p.x, p.y, p.angle, index)));
    updateHairCount();
    requestAnimationFrame(gameLoop);
}

function drawBackground() {
    const w = canvas.clientWidth; const h = canvas.clientHeight;
    ctx.clearRect(0, 0, w, h);
    if (skinImage.complete && skinImage.naturalWidth > 0) {
        ctx.drawImage(skinImage, 0, 0, w, h);
    } else {
        const gradient = ctx.createRadialGradient(w / 2, h / 2, 30, w / 2, h / 2, h);
        gradient.addColorStop(0, "#b98770"); gradient.addColorStop(1, "#69493d");
        ctx.fillStyle = gradient; ctx.fillRect(0, 0, w, h);
    }
    ctx.fillStyle = "rgba(0,0,0,.08)"; ctx.fillRect(0, 0, w, h);
}

function drawTweezers() {
    if (!draggingHair || !tweezerImage.complete || !tweezerImage.naturalWidth) return;
    const angle = Math.atan2(pointerY - draggingHair.rootY, pointerX - draggingHair.rootX);
    ctx.save(); ctx.translate(pointerX, pointerY); ctx.rotate(angle);
    ctx.globalAlpha = .94; ctx.drawImage(tweezerImage, -150 * .08, -150 * .72, 150, 150);
    ctx.restore();
}

function gameLoop() {
    drawBackground();
    hairs.forEach(hair => { hair.update(); hair.draw(); hair.drawFlying(); });
    drawTweezers();
    requestAnimationFrame(gameLoop);
}

function getPointerPosition(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

function findHair(x, y) {
    let closest = null; let closestDistance = Infinity;
    hairs.forEach(hair => {
        if (hair.removed) return;
        const root = hair.getRoot();
        const distance = Math.sqrt((x - root.x) ** 2 + (y - root.y) ** 2);
        if (distance < 35 && distance < closestDistance) { closest = hair; closestDistance = distance; }
    });
    return closest;
}

canvas.addEventListener("pointerdown", e => {
    if (puzzleFinished) return;
    const pos = getPointerPosition(e); pointerX = pos.x; pointerY = pos.y;
    const hair = findHair(pos.x, pos.y);
    if (!hair) return;
    draggingHair = hair; hair.pulling = true; hair.progress = 0;
    seGrab(); canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener("pointermove", e => {
    const pos = getPointerPosition(e); pointerX = pos.x; pointerY = pos.y;
    if (!draggingHair) return;
    const hair = draggingHair;
    const pullDistance = Math.max(0, Math.sqrt((pos.x - hair.rootX) ** 2 + (pos.y - hair.rootY) ** 2) - hair.baseLen);
    hair.progress = Math.min(pullDistance / (hair.maxLen * .65), 1.35);
    if (pullDistance > hair.maxLen) pullHair(hair);
});

canvas.addEventListener("pointerup", e => {
    if (!draggingHair) return;
    draggingHair.pulling = false; draggingHair.progress = 0; draggingHair = null;
});

function pullHair(hair) {
    hair.startFlying();
    
    // 抜いた毛に対応する個別SEを再生する
    const targetTestimony = testimoniesData[hair.testimonyIndex];
    if (targetTestimony && targetTestimony.se) {
        targetTestimony.se.currentTime = 0;
        targetTestimony.se.play().catch(e => console.log("個別SE再生エラー:", e));
    }

    pulledCount++; updateHairCount();
    collectedTestimonies.push(targetTestimony.text);
    showTestimonyPopup(targetTestimony.text);
    draggingHair = null;
}

function updateHairCount() { hairCount.textContent = `証言 ${pulledCount} / 5`; }
function showTestimonyPopup(text) { testimonyText.textContent = text; testimonyPopup.classList.add("show"); }

testimonyClose.addEventListener("click", () => {
    testimonyPopup.classList.remove("show");
    if (pulledCount >= 5 && !puzzleFinished) {
        puzzleFinished = true;
        setTimeout(startRevelationSequence, 400);
    }
});

function startRevelationSequence() {

}

revelationScreen.addEventListener("click", (e) => {
    if (e.target.id === "revNextBtn" || e.target.classList.contains("kwBtn")) return;
    if (revStep >= 0 && revStep < 5) {
        revStep++;
        showRevelationStep();
    } else if (kwAnswered && revStep >= 6 && revStep < 8) {
        revStep++;
        showRevelationStep();
    }
});

function showRevelationStep() {
    if (revStep === 0) {
        document.getElementById("revSilence").classList.add("show");
    } else if (revStep === 1) {
        document.getElementById("whisper1").classList.add("show");
    } else if (revStep === 2) {
        document.getElementById("whisper2").classList.add("show");
    } else if (revStep === 3) {
        document.getElementById("whisper3").classList.add("show");
    } else if (revStep === 4) {
        document.getElementById("whisper4").classList.add("show");
    } else if (revStep === 5) {
        document.getElementById("whisper5").classList.add("show");
        
        setTimeout(() => {
            document.getElementById("kwSelectContainer").classList.add("show");
            const hint = document.getElementById("revClickHint");
            if (hint) hint.style.display = "none";
        }, 600);
    } else if (revStep === 6) {
        document.getElementById("kwSelectContainer").classList.remove("show");
        ["whisper1", "whisper2", "whisper3", "whisper4", "whisper5", "revSilence"].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.style.display = "none";
        });
        document.getElementById("linkedGroup").classList.add("show");
    } else if (revStep === 7) {
        document.getElementById("linkedGroup").style.display = "none";
        document.getElementById("thought1").classList.add("show");
    } else if (revStep === 8) {
        document.getElementById("thought2").classList.add("show");
        document.getElementById("revNextBtn").classList.add("show");
    }
}

    // ページ読み込み時に自動再生を試みる
    titleAudio.play().catch(e => {
        console.log("ブラウザの自動再生ブロックにより、画面タッチ待ち状態です:", e.name);
    });
});

// 画面のどこかが最初にクリック/タッチされた瞬間、BGMとAudioContextを確実に有効化する
window.addEventListener("pointerdown", async () => {
    if (audioCtx && audioCtx.state === "suspended") {
        await audioCtx.resume();
    }
    // 全てのBGMが止まっていて、かつタイトル画面が表示されている（あるいはどのBGMも流れていない）場合にタイトルBGMを再生
    if (titleAudio.paused && scene2Audio.paused && moukonAudio.paused && sinsouAudio.paused && kaiketuAudio.paused) {
        try {
            await titleAudio.play();
        } catch (e) {
            console.error("タイトルBGMの再生に失敗しました:", e);
        }
    }
}, { once: true });

</script>
</body>
</html>
